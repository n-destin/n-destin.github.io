<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destin Niyomufasha</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      color: #111;
      background: #fff;
      max-width: 600px;
      margin: 90px auto;
      padding: 0 24px 100px;
    }

    h1 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 32px;
    }

    p { margin-bottom: 16px; }

    a {
      color: #111;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    a:hover { color: #555; }

    .section { margin-top: 44px; }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 16px;
    }

    .entry { margin-bottom: 24px; }

    .entry-title {
      font-weight: 500;
      margin-bottom: 2px;
    }

    .entry-title a { text-decoration: none; }
    .entry-title a:hover { text-decoration: underline; }

    .entry-meta {
      font-size: 0.875rem;
      color: #555;
      margin-bottom: 4px;
    }

    .entry-desc {
      font-size: 0.9rem;
      color: #333;
    }

    .tag {
      display: inline-block;
      font-size: 0.75rem;
      color: #777;
      background: #f3f3f3;
      border-radius: 3px;
      padding: 1px 6px;
      margin-left: 6px;
      font-weight: 500;
      vertical-align: middle;
      cursor: pointer;
      border: none;
      font-family: inherit;
      text-decoration: none;
    }
    .tag:hover { background: #e8e8e8; color: #333; }

    .contact-links { display: flex; gap: 20px; flex-wrap: wrap; }
    .contact-links a { font-size: 0.9rem; }

    /* ── PDF Modal ── */
    .pdf-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .pdf-overlay.open { display: flex; }

    .pdf-modal {
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      width: min(860px, 94vw);
      height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    }

    .pdf-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }

    .pdf-toolbar-title {
      font-size: 0.85rem;
      font-weight: 500;
      color: #111;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }

    .pdf-toolbar-actions { display: flex; gap: 10px; align-items: center; }

    .pdf-btn {
      font-size: 0.8rem;
      font-family: inherit;
      padding: 5px 12px;
      border-radius: 4px;
      border: 1px solid #ddd;
      background: #fff;
      color: #111;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .pdf-btn:hover { background: #f5f5f5; color: #111; }
    .pdf-btn.close-btn { border-color: transparent; font-size: 1.1rem; padding: 4px 8px; }

    .pdf-frame {
      flex: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <h1>Destin Niyomufasha</h1>

  <div class="section">
    <div class="section-label">Some nice results</div>

    <div class="entry">
      <div class="entry-title">
        <a href="#" class="pdf-link" data-src="pdfs/obl_submodular.pdf" data-title="Oblivious algorithms for submodular maximization">
          Oblivious algorithms for submodular maximization
        </a>
        <button class="tag pdf-link" data-src="pdfs/obl_submodular.pdf" data-title="Oblivious algorithms for submodular maximization">PDF</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Contact</div>
    <div class="contact-links">
      <a href="mailto:destin.niyomufasha@gmail.com">Email</a>
      <a href="https://www.linkedin.com/in/destin-niyomufasha" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>

  <!-- PDF Modal -->
  <div class="pdf-overlay" id="pdfOverlay">
    <div class="pdf-modal">
      <div class="pdf-toolbar">
        <span class="pdf-toolbar-title" id="pdfTitle"></span>
        <div class="pdf-toolbar-actions">
          <a class="pdf-btn" id="pdfDownload" download>&#8595; Download</a>
          <button class="pdf-btn close-btn" id="pdfClose" title="Close">&times;</button>
        </div>
      </div>
      <iframe class="pdf-frame" id="pdfFrame" title="PDF preview"></iframe>
    </div>
  </div>

  <script>
    const overlay  = document.getElementById('pdfOverlay');
    const frame    = document.getElementById('pdfFrame');
    const title    = document.getElementById('pdfTitle');
    const download = document.getElementById('pdfDownload');

    function openPDF(src, label) {
      frame.src    = src;
      title.textContent = label;
      download.href = src;
      download.setAttribute('download', label);
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closePDF() {
      overlay.classList.remove('open');
      frame.src = '';
      document.body.style.overflow = '';
    }

    document.querySelectorAll('.pdf-link').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        openPDF(el.dataset.src, el.dataset.title);
      });
    });

    document.getElementById('pdfClose').addEventListener('click', closePDF);

    overlay.addEventListener('click', e => {
      if (e.target === overlay) closePDF();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closePDF();
    });
  </script>

</body>
</html>
